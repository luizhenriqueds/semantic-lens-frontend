<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Edge to edge, no corner radius: Safari composites a favicon's transparent pixels onto white,
       so rounded corners showed as four white notches around the mark on a dark tab bar. -->
  <rect width="48" height="48" fill="#2f5d3a" />
  <!-- Ink centres on (24, 23.9); the translate makes up the 0.1 in y. -->
  <g transform="translate(4.8 4.9) scale(0.8)" fill="none" stroke="#fbfcfb" stroke-width="3.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 9H15a9 9 0 0 0-9 9v14a9 9 0 0 0 9 9h18a9 9 0 0 0 9-9v-14" />
  </g>
  <g transform="translate(4.8 4.9) scale(0.8)" fill="#fbfcfb">
    <rect x="12.5" y="27" width="5" height="7" rx="2.5" />
    <rect x="21.75" y="22" width="5" height="12" rx="2.5" />
    <rect x="31" y="5" width="5" height="29" rx="2.5" />
  </g>
</svg>
